<script>
const box=document.getElementById('noticeList');
const notices=(window.SULARC_CONTENT&&SULARC_CONTENT.notices)||[];
box.innerHTML=notices.map(n=>`
<article class="notice">
  <span class="badge">${n.category||'Notice'}</span>
  <h3>${n.title||''}</h3>
  <small>${n.date||''}</small>
  <p>${n.body||''}</p>
</article>`).join('');
